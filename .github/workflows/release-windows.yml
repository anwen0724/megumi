name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows-x64:
    # Deleting a tag also emits a push event; only a live release tag may publish artifacts.
    if: ${{ github.event.deleted == false }}
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Enable long paths for Git checkout
        run: git config --global core.longpaths true

      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.9.0

      - name: Verify toolchain
        run: |
          node --version
          npm --version

      - name: Install locked dependencies
        run: npm ci

      - name: Verify tag and package version
        run: npm run release:verify:version -- --tag "$env:GITHUB_REF_NAME"

      - name: Run release gates
        run: npm run release:verify

      - name: Build Windows x64 batch once
        run: npm run make
        env:
          MEGUMI_SIGNING_PUBLISHER: ${{ vars.MEGUMI_SIGNING_PUBLISHER }}
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

      - name: Verify final artifacts
        run: npm run release:verify:artifacts -- --directory out/desktop
        env:
          MEGUMI_SIGNING_PUBLISHER: ${{ vars.MEGUMI_SIGNING_PUBLISHER }}

      - name: Upload verified batch to Draft and verify remote bytes
        run: npm run publish -- --directory out/desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEGUMI_SIGNING_PUBLISHER: ${{ vars.MEGUMI_SIGNING_PUBLISHER }}
