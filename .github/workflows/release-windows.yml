name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows-x64:
    # Deleting a tag also emits a push event; only a live release tag may publish artifacts.
    if: ${{ github.event.deleted == false }}
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.9.0

      - name: Verify toolchain
        run: |
          node --version
          npm --version

      - name: Install locked dependencies
        run: npm ci

      - name: Verify tag and package version
        run: npm run release:verify:version -- --tag "$env:GITHUB_REF_NAME"

      - name: Run release type checks
        run: |
          npm run typecheck:packages
          npm run typecheck:product

      - name: Build and upload Draft Release
        run: npm run publish -- --arch=x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Squirrel.Windows assets
        run: npm run release:verify:artifacts -- --directory out/make/squirrel.windows/x64
