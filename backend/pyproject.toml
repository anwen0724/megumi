[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "anwen", email = "anwen@megumi.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx2>=2.13.0",
    "jsonschema>=4.26.0",
    "openai>=3.16.2",
    "partial-json-parser>=0.2.1.1.post7",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "referencing>=0.37.0",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
    "types-jsonschema>=4.26.0.20260518",
]

# --- ruff: linter + formatter (Java: Checkstyle + formatter) ---
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

# --- mypy: static type checking (Java: compiler type check) ---
[tool.mypy]
python_version = "3.12"
files = ["src"]
exclude = ['(^|[\\/])\.archive([\\/]|$)']
strict = true
warn_unreachable = true
show_error_codes = true

# --- pytest: test runner (Java: JUnit) ---
[tool.pytest.ini_options]
# Protocol suites intentionally share descriptive test module names.
markers = ["live: explicitly enabled real provider verification"]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "-q --ignore=tests/.archive --import-mode=importlib"
